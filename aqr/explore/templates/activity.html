<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AQR · Activity</title>
<style>
:root {
  --bg: #fafafa;
  --panel: #ffffff;
  --text: #111827;
  --muted: #6b7280;
  --subtle: #9ca3af;
  --accent: #2563eb;
  --accent-bg: #eff6ff;
  --green: #047857;
  --green-bg: #ecfdf5;
  --red: #b91c1c;
  --red-bg: #fef2f2;
  --yellow: #92400e;
  --yellow-bg: #fffbeb;
  --purple: #6d28d9;
  --purple-bg: #f5f3ff;
  --border: #e5e7eb;
  --border-strong: #d1d5db;
  --code-bg: #f3f4f6;
  --row-alt: #f9fafb;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg); color: var(--text);
  font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI",
    system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
code, .mono {
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  font-size: 0.92em;
}
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 24px; background: var(--panel);
  border-bottom: 1px solid var(--border);
}
.topbar h1 {
  margin: 0; font-size: 16px; font-weight: 600; color: var(--accent);
  letter-spacing: -0.01em;
}
.tabs { display: flex; gap: 8px; font-size: 13px; color: var(--muted); align-items: center; }
.tabs .tab { cursor: pointer; padding: 6px 12px; border-radius: 6px; text-decoration: none; color: var(--muted); }
.tabs .tab:hover { background: var(--row-alt); }
.tabs .tab.active { color: var(--text); background: var(--accent-bg); }
.tabs .tab-placeholder { cursor: default; padding: 6px 12px; border-radius: 6px; color: var(--subtle); font-style: italic; }
.stats {
  display: flex; align-items: center; gap: 24px;
  padding: 10px 24px; font-size: 12px; color: var(--muted);
  border-bottom: 1px solid var(--border); flex-wrap: wrap;
}
.stats strong { color: var(--text); font-weight: 500; }
.chip {
  background: var(--code-bg); padding: 3px 10px; border-radius: 12px;
  border: 1px solid var(--border); font-size: 12px;
}
.chip strong { color: var(--accent); }
.filterbar {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 24px; border-bottom: 1px solid var(--border);
  font-size: 13px; color: var(--muted); flex-wrap: wrap;
}
.filterbar-label { color: var(--muted); font-weight: 500; margin-right: 4px; }
.filter-pill {
  padding: 3px 12px; border-radius: 16px; background: var(--panel);
  border: 1px solid var(--border); cursor: pointer; font-size: 12px;
}
.filter-pill:hover { background: var(--code-bg); }
.filter-pill.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.filter-pill.active:hover { opacity: 0.9; background: var(--accent); }
.filter-right { margin-left: auto; display: flex; gap: 8px; }
.feed { max-width: 800px; margin: 24px auto; padding: 0 24px; }
.day-divider {
  font-size: 12px; color: var(--muted); margin: 24px 0 12px;
  display: flex; align-items: center; gap: 12px;
}
.day-divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }
.event {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 8px; padding: 14px 16px; margin-bottom: 8px;
  display: grid; grid-template-columns: 100px 1fr; gap: 12px;
  align-items: start;
}
.event.system-event {
  background: var(--code-bg);
  border-color: var(--border-strong);
}
.event-icon {
  display: inline-block; width: 18px; text-align: center;
}
.act-create { color: var(--accent); }
.act-edit { color: var(--yellow); }
.act-rerun { color: var(--purple); }
.act-approve { color: var(--green); }
.act-reject { color: var(--red); }
.act-comment { color: var(--muted); }
.act-ai { color: #c084fc; }
.act-status { color: var(--muted); }
.event .ts {
  color: var(--muted); font-size: 12px;
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  padding-top: 2px;
}
.event .who { font-weight: 500; }
.event .what { margin-top: 4px; line-height: 1.6; }
.diff {
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color: var(--accent); font-size: 12px;
}
.event-body { min-width: 0; }
.metrics { color: var(--text); font-size: 13px; line-height: 1.6; }
.metrics .num { font-variant-numeric: tabular-nums; }
.metrics .up { color: var(--green); }
.metrics .down { color: var(--red); }
.target {
  color: var(--accent); font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  font-weight: 500;
}
.footer-note {
  padding: 12px 24px; font-size: 12px; color: var(--muted);
  border-top: 1px solid var(--border); background: var(--panel);
  text-align: center;
}
.actor-system { color: var(--muted); font-style: italic; }
.event-label {
  font-size: 12px; font-weight: 500; letter-spacing: 0.02em;
}
blockquote {
  margin: 4px 0 0; padding: 6px 10px; background: var(--code-bg);
  border-left: 3px solid var(--border); border-radius: 4px;
  font-size: 13px; color: var(--text);
}
</style>
</head>
<body>

<div class="topbar">
  <h1>AQR · Activity</h1>
  <div class="tabs">
    <a class="tab" href="/explore">Spreadsheet</a>
    <span class="tab active">Activity</span>
    <span class="tab-placeholder">By ticker</span>
  </div>
</div>

<div class="stats">
  <span>Total events <strong id="stat-events">—</strong></span>
  <span>Unique hypotheses <strong id="stat-hyps">—</strong></span>
  <span>Unique users <strong id="stat-users">—</strong></span>
  <span class="chip">Last 7 days</span>
</div>

<div class="filterbar">
  <span class="filterbar-label">Event type:</span>
  <span class="filter-pill active" data-type="all">All</span>
  <span class="filter-pill" data-type="create">Created</span>
  <span class="filter-pill" data-type="edit">Edit</span>
  <span class="filter-pill" data-type="rerun">Rerun</span>
  <span class="filter-pill" data-type="approve">Approve</span>
  <span class="filter-pill" data-type="reject">Reject</span>
  <span class="filter-pill" data-type="comment">Comment</span>
  <span class="filter-pill" data-type="ai">AI</span>
  <span class="filter-pill" data-type="status">Status-change</span>
</div>

<div class="feed" id="feed">
  <div id="timeline-container"></div>
</div>

<div class="footer-note" id="footer-note">Loading…</div>

<script>
(function() {
  var TYPE_CFG = {
    create:  { cls: 'act-create',  icon: '+',  label: 'created' },
    created: { cls: 'act-create',  icon: '+',  label: 'created' },
    edit:    { cls: 'act-edit',    icon: '\u270E', label: 'edited' },
    rerun:   { cls: 'act-rerun',   icon: '\u27F3', label: 'rerun' },
    approve: { cls: 'act-approve', icon: '\u2713', label: 'approved' },
    reject:  { cls: 'act-reject',  icon: '\u2717', label: 'rejected' },
    comment: { cls: 'act-comment', icon: '\uD83D\uDCAC', label: 'comment' },
    ai:      { cls: 'act-ai',      icon: '\uD83E\uDD16', label: 'AI' },
    status:  { cls: 'act-status',  icon: '\u2934', label: 'status' },
  };

  var TYPE_FILTER_MAP = {
    create: 'create',
    created: 'create',
    edit: 'edit',
    rerun: 'rerun',
    approve: 'approve',
    reject: 'reject',
    comment: 'comment',
    ai: 'ai',
    status: 'status',
    'status-change': 'status',
  };

  var container = document.getElementById('timeline-container');
  var footer = document.getElementById('footer-note');
  var statEvents = document.getElementById('stat-events');
  var statHyps = document.getElementById('stat-hyps');
  var statUsers = document.getElementById('stat-users');

  var eventsData = [];

  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  function fmtDate(d) {
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  function fmtTime(d) {
    return pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function dateLabel(dateStr) {
    var d = new Date(dateStr);
    var today = new Date();
    today.setHours(0, 0, 0, 0);
    var t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    var diff = Math.round((today - t) / 86400000);
    if (diff === 0) return 'Today';
    if (diff === 1) return 'Yesterday';
    return diff + ' days ago';
  }

  function esc(s) {
    var d = document.createElement('div');
    d.appendChild(document.createTextNode(s || ''));
    return d.innerHTML;
  }

  function getActiveFilterTypes() {
    var m = {};
    document.querySelectorAll('.filter-pill[data-type].active').forEach(function(p) {
      var t = p.getAttribute('data-type');
      if (t !== 'all') m[t] = true;
    });
    return m;
  }

  function applyFilters() {
    var activeTypes = getActiveFilterTypes();
    var hasActive = Object.keys(activeTypes).length > 0;
    document.querySelectorAll('.event').forEach(function(el) {
      if (!hasActive) {
        el.style.display = '';
      } else {
        el.style.display = activeTypes[el.getAttribute('data-type')] ? '' : 'none';
      }
    });
    updateFooterCounts();
  }

  function updateFooterCounts() {
    var visible = 0;
    var hyps = {};
    var users = {};
    document.querySelectorAll('.event').forEach(function(ev) {
      if (ev.style.display !== 'none') {
        visible++;
        var h = ev.getAttribute('data-hyp');
        var u = ev.getAttribute('data-user');
        if (h) hyps[h] = true;
        if (u) users[u] = true;
      }
    });
    footer.textContent = 'Showing ' + visible + ' events across 7 days \u00B7 ' +
      Object.keys(hyps).length + ' hypotheses \u00B7 ' +
      Object.keys(users).length + ' users';
    statEvents.textContent = visible;
    statHyps.textContent = Object.keys(hyps).length;
    statUsers.textContent = Object.keys(users).length;
  }

  function renderAll() {
    container.innerHTML = '';

    if (!eventsData || eventsData.length === 0) {
      container.innerHTML = '<div style="padding:40px 0;text-align:center;color:var(--muted);font-size:14px;">No activity in the last 7 days</div>';
      updateFooterCounts();
      return;
    }

    var groups = {};
    eventsData.forEach(function(ev) {
      var d = new Date(ev.ts);
      var key = fmtDate(d);
      if (!groups[key]) groups[key] = [];
      groups[key].push(ev);
    });

    var sortedDates = Object.keys(groups).sort().reverse();

    sortedDates.forEach(function(dateKey) {
      var events = groups[dateKey];
      events.sort(function(a, b) { return new Date(b.ts) - new Date(a.ts); });

      var div = document.createElement('div');
      div.className = 'day-divider';
      div.textContent = dateLabel(dateKey) + ' \u00B7 ' + dateKey;
      container.appendChild(div);

      events.forEach(function(ev) {
        var dt = new Date(ev.ts);
        var type = ev.type || 'create';
        var cfg = TYPE_CFG[type] || TYPE_CFG.create;
        var filterType = TYPE_FILTER_MAP[type] || 'create';

        var el = document.createElement('div');
        el.className = 'event' + (ev.actor === 'system' ? ' system-event' : '');
        el.setAttribute('data-type', filterType);
        el.setAttribute('data-hyp', ev.hypothesis || '');
        el.setAttribute('data-user', ev.actor || '');

        var targetHtml = ev.target ? ' on <span class="target">' + esc(ev.target) + '</span>' : '';
        var sysCls = ev.actor === 'system' ? ' actor-system' : '';

        el.innerHTML =
          '<div class="ts">' + fmtTime(dt) + '</div>' +
          '<div class="event-body">' +
            '<div>' +
              '<span class="' + cfg.cls + '"><span class="event-icon">' + cfg.icon + '</span><span class="event-label">' + cfg.label + '</span></span> ' +
              '<span class="who' + sysCls + '">' + esc(ev.actor || '') + '</span>' + targetHtml +
            '</div>' +
            '<div class="what">' + esc(ev.description || '') + '</div>' +
          '</div>';

        container.appendChild(el);
      });
    });

    applyFilters();
  }

  document.querySelectorAll('.filter-pill[data-type]').forEach(function(pill) {
    pill.addEventListener('click', function() {
      var type = this.getAttribute('data-type');
      if (type === 'all') {
        document.querySelectorAll('.filter-pill[data-type]').forEach(function(p) {
          p.classList.toggle('active', p.getAttribute('data-type') === 'all');
        });
      } else {
        document.querySelector('.filter-pill[data-type="all"]').classList.remove('active');
        this.classList.toggle('active');
        var activeTypes = getActiveFilterTypes();
        if (Object.keys(activeTypes).length === 0) {
          document.querySelector('.filter-pill[data-type="all"]').classList.add('active');
        }
      }
      applyFilters();
    });
  });

  fetch('/api/explore/stats')
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d && typeof d.events === 'number') statEvents.textContent = d.events;
      if (d && typeof d.hypotheses === 'number') statHyps.textContent = d.hypotheses;
      if (d && typeof d.users === 'number') statUsers.textContent = d.users;
    })
    .catch(function() {});

  fetch('/api/explore/activity')
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d && Array.isArray(d)) eventsData = d;
      else if (d && Array.isArray(d.events)) eventsData = d.events;
      renderAll();
    })
    .catch(function(err) {
      container.innerHTML = '<div style="padding:40px 0;text-align:center;color:var(--muted);font-size:14px;">Failed to load activity data.</div>';
      footer.textContent = 'Failed to load';
    });
})();
</script>

</body>
</html>
