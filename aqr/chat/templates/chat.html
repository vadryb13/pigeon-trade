<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>AQR Chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #1a1d23;
    --bg-elev: #242830;
    --fg: #e4e6eb;
    --fg-dim: #8b8f99;
    --accent: #7cb7ff;
    --user: #5d8ad9;
    --bot: #2e7d5b;
    --warn: #d99a3a;
    --err: #d96a5a;
    --border: #2f343c;
    --code-bg: #15171c;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    background: var(--bg);
    color: var(--fg);
    font-size: 14px;
    line-height: 1.5;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  /* ── Header ─────────────────────────────────────── */
  header {
    flex: 0 0 auto;
    background: var(--bg-elev);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .session {
    font-size: 12px; color: var(--fg-dim);
    display: flex; align-items: center; gap: 8px;
  }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--err); transition: background 0.2s;
  }
  .status-dot.connected { background: #4caf50; }
  .status-dot.connecting { background: var(--warn); }
  .status-banner {
    flex: 0 0 auto;
    background: var(--warn); color: #000;
    padding: 6px 16px; font-size: 12px;
    text-align: center; display: none;
  }
  .status-banner.visible { display: block; }
  /* ── Login screen ─────────────────────────────── */
  .login {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
  }
  .login form {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 24px;
    min-width: 320px;
  }
  .login h2 { margin: 0 0 16px; font-size: 14px; font-weight: 600; }
  .login input {
    width: 100%; padding: 8px 10px;
    background: var(--bg); color: var(--fg);
    border: 1px solid var(--border); border-radius: 4px;
    font: inherit;
    outline: none;
  }
  .login input:focus { border-color: var(--accent); }
  .login button {
    margin-top: 12px; width: 100%;
    padding: 8px; cursor: pointer;
    background: var(--accent); color: #000;
    border: none; border-radius: 4px;
    font: inherit; font-weight: 600;
  }
  .login button:hover { filter: brightness(1.1); }
  /* ── Chat screen ──────────────────────────────── */
  .chat { flex: 1; display: none; flex-direction: column; min-height: 0; }
  .chat.active { display: flex; }
  #messages {
    flex: 1; overflow-y: auto;
    padding: 12px 16px;
    scroll-behavior: smooth;
  }
  .msg { margin-bottom: 8px; max-width: 90%; }
  .msg.user {
    margin-left: auto; text-align: right;
  }
  .msg .role {
    font-size: 11px; color: var(--fg-dim);
    margin-bottom: 2px; text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .msg.user .role { color: var(--user); }
  .msg.bot .role { color: var(--bot); }
  .msg.err .role { color: var(--err); }
  .bubble {
    display: inline-block;
    padding: 8px 12px;
    border-radius: 6px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    text-align: left;
    word-wrap: break-word;
    white-space: pre-wrap;
    max-width: 100%;
  }
  .msg.user .bubble { background: rgba(93, 138, 217, 0.12); border-color: var(--user); }
  .msg.err .bubble { background: rgba(217, 106, 90, 0.12); border-color: var(--err); }
  .ts { font-size: 10px; color: var(--fg-dim); margin-bottom: 2px; }
  /* Progress / tool_call — slim gray lines */
  .event {
    font-size: 12px; color: var(--fg-dim);
    padding: 2px 0;
    display: flex; align-items: center; gap: 6px;
  }
  .event.tool { color: #b89255; }
  .event.error { color: var(--err); }
  .event-icon { font-size: 10px; opacity: 0.7; }
  /* ── Markdown rendering inside .bubble ────────── */
  .bubble p { margin: 0 0 6px; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble code {
    background: var(--code-bg); padding: 1px 4px;
    border-radius: 3px; font-size: 12px;
  }
  .bubble pre {
    background: var(--code-bg); padding: 8px;
    border-radius: 4px; overflow-x: auto;
    margin: 6px 0; font-size: 12px;
  }
  .bubble ul, .bubble ol { margin: 4px 0 4px 18px; padding: 0; }
  .bubble h1, .bubble h2, .bubble h3 { margin: 8px 0 4px; font-size: 14px; }
  .bubble blockquote {
    border-left: 3px solid var(--border);
    padding-left: 8px; color: var(--fg-dim); margin: 6px 0;
  }
  /* ── Input ─────────────────────────────────────── */
  #input-bar {
    flex: 0 0 auto;
    background: var(--bg-elev);
    border-top: 1px solid var(--border);
    padding: 8px 16px;
    display: flex; align-items: center; gap: 8px;
  }
  #prompt { color: var(--accent); font-weight: 600; }
  #input {
    flex: 1; background: var(--bg); color: var(--fg);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 8px 10px; font: inherit; outline: none;
  }
  #input:focus { border-color: var(--accent); }
  #send {
    padding: 8px 14px; cursor: pointer;
    background: var(--accent); color: #000; border: none;
    border-radius: 4px; font: inherit; font-weight: 600;
  }
  #send:hover { filter: brightness(1.1); }
  #help-overlay {
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.7);
    display: none; align-items: center; justify-content: center;
    z-index: 100;
  }
  #help-overlay.visible { display: flex; }
  #help-overlay .box {
    background: var(--bg-elev); border: 1px solid var(--border);
    border-radius: 6px; padding: 24px; min-width: 360px;
  }
  #help-overlay h3 { margin: 0 0 12px; }
  #help-overlay kbd {
    background: var(--code-bg); padding: 2px 6px;
    border-radius: 3px; font-size: 12px;
  }
  #help-overlay .row { margin: 6px 0; }
</style>
</head>
<body>
  <div class="status-banner" id="banner"></div>
  <header>
    <h1>AQR Chat</h1>
    <div class="session">
      <span class="status-dot" id="status"></span>
      <span id="session-label">—</span>
    </div>
  </header>

  <div class="login" id="login">
    <form id="login-form">
      <h2>Новая защищённая сессия</h2>
      <button type="submit" autofocus>Начать работу</button>
    </form>
  </div>

  <div class="chat" id="chat">
    <div id="messages"></div>
    <div id="input-bar">
      <span id="prompt">&gt;</span>
      <input type="text" id="input" placeholder="сообщение или /help" autocomplete="off">
      <button id="send">Send</button>
    </div>
  </div>

  <div id="help-overlay">
    <div class="box">
      <h3>Команды</h3>
      <div class="row"><kbd>/help</kbd> — показать эту справку</div>
      <div class="row"><kbd>/run &lt;goal&gt;</kbd> — стартовать новый run (алиас для обычного сообщения)</div>
      <div class="row"><kbd>/history</kbd> — загрузить историю чата из БД</div>
      <div class="row"><kbd>/clear</kbd> — очистить окно (история в БД сохраняется)</div>
      <div class="row"><kbd>/exit</kbd> — закрыть сессию</div>
      <div class="row" style="margin-top: 14px;">
        <button id="help-close">Закрыть</button>
      </div>
    </div>
  </div>

<script>
/* ── minimal markdown renderer (headings, bold, italic, code, lists) ── */
function renderMarkdown(text) {
  const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  // 1) extract code blocks first
  const codeBlocks = [];
  text = text.replace(/```(\w*)\n([\s\S]*?)```/g, (m, lang, code) => {
    codeBlocks.push({ lang, code });
    return `\u0000CODE${codeBlocks.length - 1}\u0000`;
  });
  // 2) inline code
  const inlineCodes = [];
  text = text.replace(/`([^`\n]+)`/g, (m, code) => {
    inlineCodes.push(code);
    return `\u0000IC${inlineCodes.length - 1}\u0000`;
  });
  // 3) escape the rest
  text = esc(text);
  // 4) headings
  text = text.replace(/^### (.+)$/gm, '<h3>$1</h3>')
             .replace(/^## (.+)$/gm, '<h2>$1</h2>')
             .replace(/^# (.+)$/gm, '<h1>$1</h1>');
  // 5) bold/italic
  text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
             .replace(/\*([^*]+)\*/g, '<em>$1</em>');
  // 6) blockquote
  text = text.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');
  // 7) lists — group consecutive `- ` lines
  text = text.replace(/(^|\n)((?:[-*] .+\n?)+)/g, (m, pre, list) => {
    const items = list.trim().split('\n').map(l => `<li>${l.replace(/^[-*] /, '')}</li>`).join('');
    return `${pre}<ul>${items}</ul>`;
  });
  // 8) paragraphs — split on blank lines
  text = text.split(/\n{2,}/).map(p => {
    if (/^<(h\d|ul|ol|pre|blockquote)/.test(p.trim())) return p;
    return `<p>${p.replace(/\n/g, '<br>')}</p>`;
  }).join('');
  // 9) restore inline code
  text = text.replace(/\u0000IC(\d+)\u0000/g, (m, i) => `<code>${esc(inlineCodes[+i])}</code>`);
  // 10) restore code blocks
  text = text.replace(/\u0000CODE(\d+)\u0000/g, (m, i) => {
    const { lang, code } = codeBlocks[+i];
    return `<pre><code class="lang-${lang}">${esc(code)}</code></pre>`;
  });
  return text;
}

const state = {
  token: null,
  ws: null,
  reconnectDelay: 2000,
  connected: false,
  historyLoaded: false,
};

const $ = (id) => document.getElementById(id);
const messagesEl = $('messages');
const statusDot = $('status');
const sessionLabel = $('session-label');
const banner = $('banner');
const chatEl = $('chat');
const loginEl = $('login');
const inputEl = $('input');

function ts() {
  const d = new Date();
  return d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

function appendMessage(role, content, opts = {}) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.innerHTML = `
    <div class="ts">${ts()}</div>
    <div class="role">${role}</div>
    <div class="bubble">${role === 'bot' || role === 'err' ? renderMarkdown(content) : escapeHtml(content)}</div>
  `;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function appendEvent(icon, text, cls = '') {
  const div = document.createElement('div');
  div.className = `event ${cls}`;
  div.innerHTML = `<span class="event-icon">${icon}</span><span>${escapeHtml(text)}</span>`;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function setStatus(state) {
  statusDot.className = `status-dot ${state}`;
  if (state === 'connected') {
    statusDot.title = 'Connected';
    banner.classList.remove('visible');
  } else if (state === 'connecting') {
    statusDot.title = 'Connecting…';
  } else {
    statusDot.title = 'Disconnected';
  }
}

function showBanner(text) {
  banner.textContent = text;
  banner.classList.add('visible');
}

function playDoneSound() {
  // Subtle beep via Web Audio API — generated, no asset needed.
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value = 880;
    osc.type = 'sine';
    gain.gain.setValueAtTime(0.0001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.15, ctx.currentTime + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.18);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.2);
  } catch (e) { /* audio not available — silent */ }
}

function clearMessages() {
  messagesEl.innerHTML = '';
}

/* ── WebSocket protocol (см. aqr/chat/ws.py:1-18) ───── */
function connect() {
  if (state.ws) {
    try { state.ws.close(); } catch {}
    state.ws = null;
  }
  setStatus('connecting');
  const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
  const url = state.token
    ? `${proto}//${window.location.host}/chat/${encodeURIComponent(state.token)}`
    : `${proto}//${window.location.host}/chat/invalid`;
  const ws = new WebSocket(url);
  state.ws = ws;

  ws.onopen = () => {
    state.connected = true;
    setStatus('connected');
    // Запрашиваем историю при первом коннекте
    if (!state.historyLoaded) {
      ws.send(JSON.stringify({ type: 'resume' }));
      state.historyLoaded = true;
    }
  };

  ws.onclose = (e) => {
    state.connected = false;
    if (e.code === 1008) {
      // Auth failed — токен протух или невалиден
      setStatus('disconnected');
      showBanner('Токен невалиден или истёк. Войдите заново.');
      logout();
      return;
    }
    setStatus('disconnected');
    showBanner(`Disconnected (code ${e.code}). Переподключение через ${(state.reconnectDelay / 1000).toFixed(1)}s…`);
    setTimeout(() => connect(), state.reconnectDelay);
  };

  ws.onerror = () => { /* onclose сработает сам */ };

  ws.onmessage = (ev) => {
    let msg;
    try { msg = JSON.parse(ev.data); }
    catch { return; }
    handleServerMessage(msg);
  };
}

function handleServerMessage(msg) {
  switch (msg.type) {
    case 'connected':
      sessionLabel.textContent = msg.session_id;
      break;
    case 'history':
      clearMessages();
      (msg.messages || []).forEach(m => {
        const role = m.role === 'user' ? 'user' : 'bot';
        appendMessage(role, m.content);
      });
      appendEvent('─', 'история загружена');
      break;
    case 'user_echo':
      appendMessage('user', msg.content);
      break;
    case 'progress':
      appendEvent('▸', `${msg.node}${msg.data ? ' ' + JSON.stringify(msg.data).slice(0, 80) : ''}`);
      break;
    case 'tool_call':
      appendEvent('🔧', `${msg.name}${msg.args ? ' ' + JSON.stringify(msg.args).slice(0, 60) : ''}`, 'tool');
      break;
    case 'tool_result':
      appendEvent('✓', msg.name || 'result');
      break;
    case 'assistant':
      appendMessage('bot', msg.content);
      break;
    case 'done':
      appendMessage('bot', msg.narrative || msg.assistant || '(пустой отчёт)');
      appendEvent('✓', `done in ${msg.elapsed_seconds || '?'}s · ${msg.n_results || 0} results`);
      playDoneSound();
      break;
    case 'error':
      appendMessage('err', msg.message || 'Unknown error');
      break;
    case 'pong':
      break;
    default:
      appendEvent('?', `unknown: ${JSON.stringify(msg).slice(0, 100)}`);
  }
}

function sendMessage(text) {
  if (!text) return;
  if (!state.ws || state.ws.readyState !== WebSocket.OPEN) {
    appendMessage('err', 'Не подключено к серверу.');
    return;
  }
  // Send as plain message — slash-commands are client-side.
  state.ws.send(JSON.stringify({ type: 'message', content: text }));
  inputEl.value = '';
}

function handleCommand(line) {
  const cmd = line.trim();
  if (!cmd) return;
  if (cmd === '/help') {
    $('help-overlay').classList.add('visible');
    return;
  }
  if (cmd === '/exit') {
    logout();
    return;
  }
  if (cmd === '/clear') {
    clearMessages();
    return;
  }
  if (cmd === '/history') {
    if (state.ws && state.ws.readyState === WebSocket.OPEN) {
      state.ws.send(JSON.stringify({ type: 'resume' }));
      appendEvent('─', 'запрошена история');
    } else {
      appendMessage('err', 'Не подключено.');
    }
    return;
  }
  if (cmd.startsWith('/run ')) {
    sendMessage(cmd.slice(5));
    return;
  }
  if (cmd.startsWith('/')) {
    appendMessage('err', `Неизвестная команда: ${cmd}. /help для списка.`);
    return;
  }
  sendMessage(cmd);
}

function logout() {
  if (state.ws) {
    try { state.ws.close(); } catch {}
    state.ws = null;
  }
  state.connected = false;
  state.historyLoaded = false;
  state.token = null;
  sessionLabel.textContent = '—';
  setStatus('disconnected');
  chatEl.classList.remove('active');
  loginEl.style.display = 'flex';
  clearMessages();
  banner.classList.remove('visible');
}

async function login() {
  try {
    const r = await fetch('/chat/new', { method: 'POST' });
    if (!r.ok) {
      alert(`Login failed: ${r.status}`);
      return;
    }
    const data = await r.json();
    state.token = data.token;
    loginEl.style.display = 'none';
    chatEl.classList.add('active');
    connect();
  } catch (e) {
    alert(`Network error: ${e.message}`);
  }
}

/* ── Event listeners ──────────────────────────── */
$('login-form').addEventListener('submit', (e) => {
  e.preventDefault();
  login();
});

$('send').addEventListener('click', () => handleCommand(inputEl.value));

inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    handleCommand(inputEl.value);
  }
});

$('help-close').addEventListener('click', () => {
  $('help-overlay').classList.remove('visible');
});

$('help-overlay').addEventListener('click', (e) => {
  if (e.target.id === 'help-overlay') $('help-overlay').classList.remove('visible');
});

</script>
</body>
</html>
