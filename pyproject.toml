[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aqr"
version = "0.3.0"
description = "Strict-mode quant pipeline: natural-language goal -> validated hypotheses on MOEX via T-Invest"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Vadim Rybalko" }]
requires-python = ">=3.11"
keywords = ["quantitative-finance", "moex", "t-invest", "tinkoff", "backtest", "deflated-sharpe", "cpcv"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# Ядро — минимум, без которого ничего не работает
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.0",
    # Hypothesis Registry + Storage
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "alembic>=1.13",
    # Per-session credentials (Fernet via HKDF от AQR_SESSION_SECRET)
    "cryptography>=42",
    # Agent (LangGraph)
    "langgraph>=0.2",
    # T-Invest gRPC (закрытый PyPI T-Bank — см. AGENTS.md gotcha)
    "t-tech-investments",
]

[project.optional-dependencies]
# LLM-режим планировщика и нарратора (без этого ChatPlanner/Narrator не работают)
llm = [
    "litellm>=1.45,<2.0",
]
# Embeddings для дедупликации (без этого Embedder не работает)
embeddings = [
    "openai>=1.0",
]
# OHLCV-кэш (DuckDB-файл в ~/.aqr/)
data = [
    "duckdb>=1.0",
]
# Разработка
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "python-multipart",
]

[project.urls]
Repository = "https://github.com/vadryb13/aqr"
Issues = "https://github.com/vadryb13/aqr/issues"

[tool.setuptools.packages.find]
include = ["aqr*"]

# t-tech-investments — на закрытом PyPI T-Bank.
# uv: pip install t-tech-investments \
#     --index-url https://opensource.tbank.ru/api/v4/projects/238/packages/pypi/simple
[[tool.uv.index]]
name = "tbank"
url = "https://opensource.tbank.ru/api/v4/projects/238/packages/pypi/simple"

[tool.uv.sources]
t-tech-investments = { index = "tbank" }

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
# E501: line-length — единичные строки в docs/JSONB allow
# B008: FastAPI-стиль Depends() в default — idiomatic
# SIM108: ternary vs if — стилистика, не блокер
# B007: loop control var unused в unpacking — типично для iter(split())
# B905: zip(strict=) — pre-existing, fixed incrementally
# B904: raise ... from err — pre-existing, fixed incrementally
# E402: pre-existing в executor.py/events.py (lazy imports by design)
# E731: pre-existing в тестах — lambdas в MagicMock-цепочках
# F401/F841: pre-existing в неиспользуемых параметрах тестов (deque оставит для читаемости)
# B017: pytest.raises(Exception) — допустимо для проверки WebSocketDisconnect в starlette
ignore = [
    "E501", "B008", "SIM108", "B007", "B905", "B904",
    "E402", "E731", "F401", "F841", "B017",
]
