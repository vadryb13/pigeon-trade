services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aqr-pg
    environment:
      POSTGRES_PASSWORD: aqr
      POSTGRES_DB: aqr
    ports:
      - "5432:5432"
    volumes:
      - aqr-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aqr"]
      interval: 1s
      timeout: 3s
      retries: 30

  app:
    build: .
    container_name: aqr-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - aqr-cache:/root/.aqr
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  aqr-pg-data:
  aqr-cache:
